services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-personal-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    # PostgreSQL escucha en 5432 dentro del contenedor. El servicio Playwright
    # usa el puerto 3000, por lo que no se debe publicar ambos en el mismo host.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - assistant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  n8n:
    image: n8nio/n8n:1.121.3
    container_name: ai-personal-assistant-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL}
      N8N_LOG_OUTPUT: console
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PROXY_HOPS: 1
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://playwright:3000}
      EXECUTIONS_MODE: regular
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: true
      EXECUTIONS_TIMEOUT: 300
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_RECIPIENT: ${WHATSAPP_RECIPIENT}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      GOOGLE_DOCS_FOLDER_ID: ${GOOGLE_DOCS_FOLDER_ID}
      GOOGLE_DOCS_FOLDER_OPENAI_ID: ${GOOGLE_DOCS_FOLDER_OPENAI_ID}
      GOOGLE_DOCS_FOLDER_GOOGLE_ID: ${GOOGLE_DOCS_FOLDER_GOOGLE_ID}
      GOOGLE_DOCS_FOLDER_MICROSOFT_ID: ${GOOGLE_DOCS_FOLDER_MICROSOFT_ID}
      GOOGLE_DOCS_FOLDER_NVIDIA_ID: ${GOOGLE_DOCS_FOLDER_NVIDIA_ID}
      GOOGLE_DOCS_FOLDER_ESPACIO_ID: ${GOOGLE_DOCS_FOLDER_ESPACIO_ID}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/files/n8n:ro
      - ./automations:/files/automations:ro
      - ./prompts:/files/prompts:ro
      - ./output:/files/output
    networks:
      - assistant_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  playwright:
    build:
      context: ./playwright
    container_name: ai-personal-assistant-playwright
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./playwright:/app
    networks:
      - assistant_network

  backend:
    build:
      context: ./backend
    container_name: ai-personal-assistant-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_API_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-}
      PLAYWRIGHT_API_URL: http://playwright:3000
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://playwright:3000}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${BACKEND_SECRET_KEY:-change-me-in-production-with-a-secure-random-key}
      TZ: ${TZ}
    volumes:
      - ./backend:/app
      - ./automations:/app/automations
    networks:
      - assistant_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: ai-personal-assistant-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"
    networks:
      - assistant_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  n8n_data:

networks:
  assistant_network:
    name: ai_personal_assistant_network
    driver: bridge

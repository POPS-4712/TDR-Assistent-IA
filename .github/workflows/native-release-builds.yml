name: Native Multiplatform Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target to build. Use all for the only release-eligible path.
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - macos-x64
          - macos-arm64
      create_release:
        description: Create the public GitHub release only after every native target passes.
        required: true
        default: false
        type: boolean

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Source integrity and test preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      commit: ${{ steps.commit.outputs.value }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install static workflow validation dependency
        shell: bash
        run: python -m pip install PyYAML==6.0.1

      - name: Verify version, tracked source, and packaging definitions
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.0.0"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --exit-code
          git diff --cached --exit-code
          python packaging/common/validate_definitions.py
          python packaging/common/validate_release_ci.py

      - name: Record immutable release inputs
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Record source commit
        id: commit
        shell: bash
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }} native build
    needs: preflight
    if: ${{ inputs.target == 'all' || inputs.target == matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            family: windows
            architecture: x64
            host_arch: AMD64
            formats: exe,zip
            build_command: packaging/windows/build-windows.ps1 -Architecture x64
            expected_files: AutomationCenter-1.0.0-win-x64.exe,AutomationCenter-1.0.0-win-x64.zip
          - target: windows-arm64
            runner: windows-11-arm
            family: windows
            architecture: arm64
            host_arch: ARM64
            formats: exe,zip
            build_command: packaging/windows/build-windows.ps1 -Architecture arm64
            expected_files: AutomationCenter-1.0.0-win-arm64.exe,AutomationCenter-1.0.0-win-arm64.zip
          - target: linux-x64
            runner: ubuntu-24.04
            family: linux
            architecture: x64
            host_arch: x86_64
            formats: deb,tar.gz
            build_command: packaging/linux/build-linux.sh amd64
            expected_files: AutomationCenter-1.0.0-linux-x64.deb,AutomationCenter-1.0.0-linux-x64.tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            family: linux
            architecture: arm64
            host_arch: aarch64
            formats: deb,tar.gz
            build_command: packaging/linux/build-linux.sh arm64
            expected_files: AutomationCenter-1.0.0-linux-arm64.deb,AutomationCenter-1.0.0-linux-arm64.tar.gz
          - target: macos-x64
            runner: macos-26-intel
            family: macos
            architecture: x64
            host_arch: x86_64
            formats: dmg
            build_command: packaging/macos/build-macos.sh x64
            expected_files: AutomationCenter-1.0.0-macos-x64.dmg
          - target: macos-arm64
            runner: macos-26
            family: macos
            architecture: arm64
            host_arch: arm64
            formats: dmg
            build_command: packaging/macos/build-macos.sh arm64
            expected_files: AutomationCenter-1.0.0-macos-arm64.dmg

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for the native architecture
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Windows runner architecture
        if: ${{ matrix.family == 'windows' }}
        shell: powershell
        run: |
          $actual = $env:PROCESSOR_ARCHITECTURE
          if ($actual -ne '${{ matrix.host_arch }}') { throw "Native runner mismatch: expected ${{ matrix.host_arch }}, received $actual" }

      - name: Validate Unix runner architecture
        if: ${{ matrix.family != 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Install backend test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend regression tests
        working-directory: backend
        shell: bash
        run: python -m pytest -q tests/

      - name: Install frontend dependencies deterministically
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Run frontend regression tests and production build
        working-directory: frontend
        shell: bash
        run: |
          npm test -- --run
          npm run build

      - name: Install Windows packaging tools
        if: ${{ matrix.family == 'windows' }}
        shell: powershell
        run: |
          python -m pip install pyinstaller
          choco install innosetup -y --no-progress

      - name: Build Windows native artifacts
        if: ${{ matrix.family == 'windows' }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build-windows.ps1 -Architecture ${{ matrix.architecture }}

      - name: Install Linux packaging tools
        if: ${{ matrix.family == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev file
          python -m pip install pyinstaller

      - name: Build Linux native artifacts
        if: ${{ matrix.family == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/linux/build-linux.sh
          packaging/linux/build-linux.sh ${{ matrix.architecture == 'x64' && 'amd64' || 'arm64' }}

      - name: Install macOS packaging tools
        if: ${{ matrix.family == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pyinstaller
          command -v hdiutil
          command -v pkgbuild
          command -v codesign
          command -v file

      - name: Build macOS native artifacts
        if: ${{ matrix.family == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/macos/build-macos.sh
          packaging/macos/build-macos.sh ${{ matrix.architecture }}

      - name: Verify expected Windows files and native payload architecture
        if: ${{ matrix.family == 'windows' }}
        shell: powershell
        run: |
          $files = '${{ matrix.expected_files }}'.Split(',')
          foreach ($file in $files) {
            $path = Join-Path "dist/${{ matrix.target }}" $file
            if (-not (Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) { throw "Missing or empty artifact: $path" }
            python packaging/common/scan_artifact.py $path --report-names
            if ($LASTEXITCODE -ne 0) { throw "Security scan failed: $path" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead("dist/${{ matrix.target }}/AutomationCenter-1.0.0-win-${{ matrix.architecture }}.zip")
          $entry = $archive.Entries | Where-Object { $_.FullName -eq 'AutomationCenter.exe' } | Select-Object -First 1
          if (-not $entry) { $archive.Dispose(); throw 'Portable archive has no native launcher' }
          $temp = Join-Path $env:RUNNER_TEMP 'AutomationCenter.exe'
          try {
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $temp, $true)
            $bytes = [System.IO.File]::ReadAllBytes($temp)
            $offset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [System.BitConverter]::ToUInt16($bytes, $offset + 4)
            $expected = if ('${{ matrix.architecture }}' -eq 'x64') { 0x8664 } else { 0xAA64 }
            if ($machine -ne $expected) { throw ("Launcher PE architecture mismatch: expected 0x{0:X4}, got 0x{1:X4}" -f $expected, $machine) }
          } finally {
            $archive.Dispose()
            Remove-Item -LiteralPath $temp -Force -ErrorAction SilentlyContinue
          }

      - name: Verify expected Linux or macOS files
        if: ${{ matrix.family != 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a files <<< "${{ matrix.expected_files }}"
          for file in "${files[@]}"; do
            path="dist/${{ matrix.target }}/$file"
            test -s "$path"
            python packaging/common/scan_artifact.py "$path" --report-names
          done

      - name: Record native build provenance and target checksums
        shell: bash
        run: |
          set -euo pipefail
          python packaging/common/release_manifest.py provenance \
            --platform "${{ matrix.target }}" \
            --architecture "${{ matrix.architecture }}" \
            --commit "${{ needs.preflight.outputs.commit }}" \
            --source-integrity clean \
            --architecture-verified \
            --runner-os "$RUNNER_OS" \
            --runner-architecture "$(uname -m 2>/dev/null || echo "$PROCESSOR_ARCHITECTURE")" \
            --toolchain "$(python --version)" \
            --toolchain "$(node --version)"
          python packaging/common/release_manifest.py verify
          python packaging/common/release_manifest.py sha256s

      - name: Upload native build evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/${{ matrix.target }}/*
            dist/release-manifest.json
            dist/SHA256SUMS.txt
            dist/provenance/${{ matrix.target }}.json

  assemble-release:
    name: Assemble verified multiplatform release bundle
    needs: [preflight, build]
    if: ${{ inputs.target == 'all' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all native target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: incoming
          merge-multiple: false

      - name: Assemble, verify, and checksum only downloaded real artifacts
        shell: bash
        run: |
          set -euo pipefail
          python packaging/common/release_manifest.py assemble --source-root incoming
          python packaging/common/release_manifest.py verify --complete --security-scan
          python packaging/common/release_manifest.py sha256s --complete --security-scan
          test "$(find dist -type f -name 'AutomationCenter-1.0.0-*' | wc -l | tr -d ' ')" = "10"

      - name: Upload final release bundle
        uses: actions/upload-artifact@v4
        with:
          name: AutomationCenter-1.0.0-multiplatform-release
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/windows-x64/*
            dist/windows-arm64/*
            dist/linux-x64/*
            dist/linux-arm64/*
            dist/macos-x64/*
            dist/macos-arm64/*
            dist/release-manifest.json
            dist/SHA256SUMS.txt
            dist/provenance/*

  publish-release:
    name: Publish GitHub release only after complete validation
    needs: [preflight, assemble-release]
    if: ${{ inputs.target == 'all' && inputs.create_release && needs.assemble-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download complete validated release bundle
        uses: actions/download-artifact@v4
        with:
          name: AutomationCenter-1.0.0-multiplatform-release
          path: dist

      - name: Revalidate manifest before publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "${{ needs.preflight.outputs.version }}"
          python packaging/common/release_manifest.py verify --complete --security-scan
          python packaging/common/release_manifest.py sha256s --complete --security-scan
          test -f dist/SHA256SUMS.txt

      - name: Create immutable public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${{ needs.preflight.outputs.version }}" \
            --title "Automation Center ${{ needs.preflight.outputs.version }}" \
            --generate-notes \
            dist/windows-x64/* \
            dist/windows-arm64/* \
            dist/linux-x64/* \
            dist/linux-arm64/* \
            dist/macos-x64/* \
            dist/macos-arm64/* \
            dist/SHA256SUMS.txt \
            dist/release-manifest.json
